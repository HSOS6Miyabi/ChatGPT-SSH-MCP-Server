[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "chatgpt-ssh-mcp"
version = "1.0.0"
description = "Remote MCP server for SSH command execution and SFTP file management"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "SSH MCP Contributors"}]
dependencies = [
  "mcp>=1.20,<2",
  "paramiko>=3.4,<5",
  "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-asyncio>=0.23", "httpx>=0.27"]

[project.scripts]
chatgpt-ssh-mcp = "ssh_mcp.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]