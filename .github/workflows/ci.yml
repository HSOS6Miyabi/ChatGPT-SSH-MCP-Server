name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python-version }} tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e '.[test]'
      - name: Compile source and tests
        run: python -m compileall -q src tests
      - name: Check installed dependencies
        run: python -m pip check
      - name: Run automated tests (including real MCP HTTP integration)
        run: python -m pytest -q -ra

  package:
    name: Build and validate distributions
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install build tooling
        run: python -m pip install --upgrade pip build twine
      - name: Build source and wheel distributions
        run: python -m build
      - name: Validate package metadata
        run: python -m twine check dist/*
      - name: Smoke test the installed wheel
        run: |
          python -m pip install dist/*.whl
          python -c 'from ssh_mcp.server import mcp; from ssh_mcp.service import SSHService; assert mcp is not None; assert SSHService is not None'
      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: python-distributions
          path: dist/*
          if-no-files-found: error

  container:
    name: Build Docker image
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build container (no registry publishing)
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          push: false
          tags: chatgpt-ssh-mcp:ci
      - name: Verify container startup and bearer authentication
        shell: bash
        run: |
          set -euo pipefail
          docker run -d --name ssh-mcp-ci -p 127.0.0.1:18080:8000 \
            -e MCP_BEARER_TOKEN=ci-testing-secret-please-replace-123456 \
            -e MCP_ALLOWED_HOSTS=127.0.0.1,127.0.0.1:* \
            chatgpt-ssh-mcp:ci
          trap 'docker logs ssh-mcp-ci; docker rm -f ssh-mcp-ci' EXIT
          for attempt in {1..30}; do
            status=$(curl -s -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:18080/mcp || true)
            if [[ "$status" == "401" ]]; then exit 0; fi
            sleep 1
          done
          echo 'Expected unauthenticated MCP request to return HTTP 401' >&2
          exit 1